name: Build PCSX3-ReARMed CFW + GNPDRM packages

on:
  workflow_call:
    inputs:
      package_name:
        description: "Basename for generated package files (without extension)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build PS3 CFW + GNPDRM PKGs
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout PCSX3-ReARMed
        uses: actions/checkout@v6

      - name: Checkout pinned RetroArch libretro-common headers
        uses: actions/checkout@v6
        with:
          repository: libretro/RetroArch
          ref: cbe5e51259a994db1fef41e6e368a0ae9276069a
          path: ps3-port/RetroArch
          sparse-checkout: |
            libretro-common/include
          sparse-checkout-cone-mode: true
          persist-credentials: false

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libelf-dev libgmp-dev libmpc3 libmpfr6 libncurses6 libssl-dev \
            python3 python-is-python3 zlib1g-dev

      - name: Restore PS3DEV toolchain cache
        id: ps3dev-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ps3dev
          key: ps3dev-nightly-2026-10-12-linux-X64

      - name: Install pinned PS3DEV toolchain
        if: steps.ps3dev-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/ps3dev-linux-X64.tar.gz"
          curl --fail --location --retry 5 --retry-delay 2 \
            "https://github.com/ps3dev/ps3dev/releases/download/nightly-2026-10-12/ps3dev-linux-X64.tar.gz" \
            --output "$archive"
          gzip -t "$archive"
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          rm -f "$archive"
          test -x "$RUNNER_TEMP/ps3dev/ppu/bin/ppu-gcc"
          test -f "$RUNNER_TEMP/ps3dev/bin/sfo.xml"

      - name: Configure PS3DEV environment
        shell: bash
        run: |
          set -euo pipefail
          export PS3DEV="$RUNNER_TEMP/ps3dev"
          export PSL1GHT="$PS3DEV"
          export PORTLIBS="$PS3DEV/portlibs/ppu"
          export PATH="$PS3DEV/bin:$PS3DEV/ppu/bin:$PS3DEV/spu/bin:$PATH"
          echo "PS3DEV=$PS3DEV" >> "$GITHUB_ENV"
          echo "PSL1GHT=$PSL1GHT" >> "$GITHUB_ENV"
          echo "PORTLIBS=$PORTLIBS" >> "$GITHUB_ENV"
          echo "$PS3DEV/bin" >> "$GITHUB_PATH"
          echo "$PS3DEV/ppu/bin" >> "$GITHUB_PATH"
          echo "$PS3DEV/spu/bin" >> "$GITHUB_PATH"
          for tool in ppu-gcc ppu-ar ppu-strip sprxlinker make_self_npdrm sfo pkg package_finalize; do
            command -v "$tool" >/dev/null || {
              echo "::error::Required PS3 tool not found on PATH: $tool"
              exit 1
            }
          done
          ppu-gcc --version | head -n 1

      - name: Recreate the expected source layout
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p /home/claude
          if [ -e /home/claude/w ] && [ ! -L /home/claude/w ]; then
            sudo rm -rf /home/claude/w
          fi
          sudo ln -sfn "$GITHUB_WORKSPACE/ps3-port" /home/claude/w
          test -d /home/claude/w/wsps3
          test -d /home/claude/w/wsapp
          test -d /home/claude/w/RetroArch/libretro-common/include

      - name: Verify application ID consistency
        shell: bash
        run: |
          set -euo pipefail
          app_id="PCSX3REA1"
          content_id="UP0001-${app_id}_00-0000000000000001"

          grep -Fq -- "CID=$content_id" ps3-port/build_app.sh
          grep -Fq -- "--appid $app_id" ps3-port/build_app.sh
          grep -Fq -- '#define BASE "/dev_hdd0/game/PCSX3REA1/USRDIR"' ps3-port/wsapp/main.c

          # The former ID was WSTN00001. Reject a stale install path or package ID.
          if grep -R -n -F --exclude='*.pkg' -- 'WSTN00001' \
            ps3-port/build_app.sh ps3-port/wsapp ps3-port/wsps3; then
            echo "::error::Found a stale WSTN00001 app-ID reference"
            exit 1
          fi
          echo "Application ID is consistent: $app_id ($content_id)"

      - name: Build CFW package and finalize GNPDRM copy
        shell: bash
        env:
          PACKAGE_NAME: ${{ inputs.package_name }}
        run: |
          set -euo pipefail
          if [[ -z "$PACKAGE_NAME" || "$PACKAGE_NAME" == *"/"* || "$PACKAGE_NAME" == *".."* ]]; then
            echo "::error::Invalid package basename: $PACKAGE_NAME"
            exit 1
          fi

          out="$GITHUB_WORKSPACE/artifacts"
          rm -rf "$out"
          mkdir -p "$out"

          # The ordinary PSL1GHT PKG is the CFW/debug-installable variant.
          bash /home/claude/w/build_ws.sh
          OUT="$out" bash /home/claude/w/build_app.sh "$PACKAGE_NAME"

          cfw_pkg="$out/$PACKAGE_NAME.pkg"
          gnpdrm_pkg="$out/$PACKAGE_NAME.gnpdrm.pkg"
          test -s "$cfw_pkg"

          # PSL1GHT's standard flow finalizes a copy, preserving the CFW PKG.
          cp "$cfw_pkg" "$gnpdrm_pkg"
          package_finalize "$gnpdrm_pkg"
          test -s "$gnpdrm_pkg"

      - name: Verify both package variants and package-only output
        shell: bash
        env:
          PACKAGE_NAME: ${{ inputs.package_name }}
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/artifacts"
          cfw_pkg="$out/$PACKAGE_NAME.pkg"
          gnpdrm_pkg="$out/$PACKAGE_NAME.gnpdrm.pkg"

          test -s "$cfw_pkg"
          test -s "$gnpdrm_pkg"

          shopt -s nullglob
          packages=( "$out"/*.pkg )
          if (( ${#packages[@]} != 2 )); then
            echo "::error::Expected exactly two package files; found ${#packages[@]}"
            find "$out" -maxdepth 1 -type f -printf '%f\n' || true
            exit 1
          fi
          if find "$out" -mindepth 1 -maxdepth 1 -type f ! -name '*.pkg' -print -quit | grep -q .; then
            echo "::error::The release output directory contains non-PKG files"
            exit 1
          fi

          for package in "$cfw_pkg" "$gnpdrm_pkg"; do
            magic="$(od -An -N4 -tx1 "$package" | tr -d ' \n')"
            if [[ "$magic" != "7f504b47" ]]; then
              echo "::error::Output does not have a PS3 PKG header: $(basename "$package") ($magic)"
              exit 1
            fi
            echo "Validated $(basename "$package") ($(stat -c%s "$package") bytes)"
          done

      - name: Upload both package artifacts (PKG files only)
        uses: actions/upload-artifact@v7
        with:
          name: pcsx3rearmed-cfw-gnpdrm
          path: artifacts/*.pkg
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
